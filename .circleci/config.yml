version: 2.1

orbs:
  node: circleci/node@7.2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:24.0-browsers
    steps:
      - checkout
      - node/install:
          node-version: '25.8.1'
      - restore_cache:
          name: Restore Yarn Package Cache
          keys:
            - yarn-packages-{{ checksum "yarn.lock" }}
      - run: yarn install --non-interactive
      # Yarn's --frozen-lockfile option should do this, but it doesn't work in practice.
      - run:
          name: Check if yarn.lock changed
          command: git diff --exit-code
      - save_cache:
          key: yarn-packages-{{ checksum "yarn.lock" }}
          paths:
            - /root/project/node_modules
      - run: yarn build
      - deploy:
          command: |
            if echo "${CIRCLE_TAG}" | grep -Eq '[0-9]+(\.[0-9]+)+(-[a-zA-Z]+[0-9]*)*'; then
              # From https://docs.npmjs.com/trusted-publishers#circleci-configuration
              NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
              export NPM_ID_TOKEN
              yarn circle-publish
            fi

workflows:
  build:
    jobs:
      - build:
          filters:
            tags:
              only: /.*/
